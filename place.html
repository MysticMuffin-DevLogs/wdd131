<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan | Country Page | Daniel McKenna | WDD 131</title>
    <meta
      name="description"
      content="Country page for Japan by Daniel McKenna for WDD 131: key facts, a responsive hero image, and current weather with a calculated wind chill."
    />
    <meta name="author" content="Daniel McKenna" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/place.css" />
    <script src="scripts/place.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Japan</h1>
    </header>

    <main>
      <picture class="hero">
        <source
          srcset="images/japan-hero-large.webp"
          media="(min-width: 1000px)"
        />
        <source
          srcset="images/japan-hero-medium.webp"
          media="(min-width: 500px)"
        />
        <img
          src="images/japan-hero-small.webp"
          alt="Scenic landscape in Japan"
          width="480"
          height="320"
        />
      </picture>

      <section class="data">
        <h2>Data</h2>
        <dl>
          <dt>Area</dt>
          <dd>377,975 km²</dd>
          <dt>Population</dt>
          <dd>About 123 million</dd>
          <dt>Capital</dt>
          <dd>Tokyo</dd>
          <dt>Language</dt>
          <dd>Japanese</dd>
          <dt>Currency</dt>
          <dd>Japanese yen (JPY)</dd>
          <dt>Time Zone</dt>
          <dd>JST (UTC+9)</dd>
          <dt>Calling Code</dt>
          <dd>+81</dd>
          <dt>Internet TLD</dt>
          <dd>.jp</dd>
        </dl>
      </section>

      <section class="weather">
        <h2>Weather</h2>
        <img
          class="weather-icon"
          src="images/weather-icon.svg"
          alt="Cloudy with light snow"
          width="64"
          height="64"
        />
        <p><strong>Temperature:</strong> <span id="temp"></span> °C</p>
        <p><strong>Conditions:</strong> Cloudy, light snow</p>
        <p><strong>Wind:</strong> <span id="speed"></span> km/h</p>
        <p><strong>Wind Chill:</strong> <span id="chill"></span></p>
      </section>
    </main>

    <footer>
      <p>&copy;<span id="currentyear"></span> Daniel McKenna US</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
