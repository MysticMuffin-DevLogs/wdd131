<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Review | WDD 131 | Daniel McKenna</title>
    <meta
      name="description"
      content="Submit a product review with rating, installation date, useful features, and a written review. WDD 131 forms assignment."
    />
    <meta name="author" content="Daniel McKenna" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/form.css" />
    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Product Review</h1>
    </header>

    <main>
      <form method="get" action="review.html">
        <!-- Product -->
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <!-- Rating -->
        <fieldset class="rating">
          <legend>Overall Rating</legend>
          <div class="stars">
            <input type="radio" id="rating5" name="rating" value="5" required />
            <label for="rating5" title="5 stars"
              ><span class="sr-only">5 stars</span>★</label
            >
            <input type="radio" id="rating4" name="rating" value="4" required />
            <label for="rating4" title="4 stars"
              ><span class="sr-only">4 stars</span>★</label
            >
            <input type="radio" id="rating3" name="rating" value="3" required />
            <label for="rating3" title="3 stars"
              ><span class="sr-only">3 stars</span>★</label
            >
            <input type="radio" id="rating2" name="rating" value="2" required />
            <label for="rating2" title="2 stars"
              ><span class="sr-only">2 stars</span>★</label
            >
            <input type="radio" id="rating1" name="rating" value="1" required />
            <label for="rating1" title="1 star"
              ><span class="sr-only">1 star</span>★</label
            >
          </div>
        </fieldset>

        <!-- Date -->
        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required />

        <!-- Features -->
        <fieldset class="features">
          <legend>Useful Features <span>(check all that apply)</span></legend>
          <label
            ><input
              type="checkbox"
              id="durability"
              name="features"
              value="Durability"
            />
            Durability</label
          >
          <label
            ><input
              type="checkbox"
              id="easeOfUse"
              name="features"
              value="Ease of Use"
            />
            Ease of Use</label
          >
          <label
            ><input
              type="checkbox"
              id="performance"
              name="features"
              value="Performance"
            />
            Performance</label
          >
          <label
            ><input
              type="checkbox"
              id="design"
              name="features"
              value="Design"
            />
            Design</label
          >
          <label
            ><input
              type="checkbox"
              id="value"
              name="features"
              value="Value for Money"
            />
            Value for Money</label
          >
        </fieldset>

        <!-- Written review -->
        <label for="review"
          >Written Review <span class="optional">(optional)</span></label
        >
        <textarea id="review" name="review" rows="5"></textarea>

        <!-- User name -->
        <label for="userName"
          >Your Name <span class="optional">(optional)</span></label
        >
        <input type="text" id="userName" name="userName" autocomplete="name" />

        <input type="submit" value="Post Review" />
      </form>
    </main>

    <footer>
      <p>&copy;<span id="currentyear"></span> Daniel McKenna | WDD 131</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
